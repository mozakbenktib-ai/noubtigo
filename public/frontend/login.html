<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Noubtigo SaaS</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--secondary-bg);
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .auth-wrapper::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: var(--primary-gradient);
            filter: blur(150px);
            opacity: 0.15;
            top: -100px;
            right: -100px;
            border-radius: 50%;
            z-index: 0;
        }

        .auth-wrapper::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: #22c55e;
            filter: blur(120px);
            opacity: 0.1;
            bottom: -50px;
            left: -50px;
            border-radius: 50%;
            z-index: 0;
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            z-index: 10;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .auth-logo {
            width: 60px;
            height: 60px;
            background: var(--primary-gradient);
            color: white;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1.5rem;
            box-shadow: 0 8px 16px rgba(34, 197, 94, 0.3);
        }

        .form-control {
            border-radius: 12px;
            padding: 0.8rem 1rem;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        [data-bs-theme="dark"] .form-control {
            background: rgba(30, 41, 59, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }

        .form-control:focus {
            border-color: #22c55e;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1);
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card fade-in">
            <div class="glass-card p-5">
                <div class="auth-header">
                    <div class="auth-logo">
                        <i class="bi bi-lightning-charge-fill"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Welcome back!</h3>
                    <p class="text-secondary small">Login to your Noubtigo account</p>
                </div>

                <form id="loginForm">
                    <div class="mb-4">
                        <label class="form-label fw-medium small">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-0 ps-0 pe-2"><i class="bi bi-envelope text-secondary"></i></span>
                            <input type="email" class="form-control" placeholder="name@company.com" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <div class="d-flex justify-content-between">
                            <label class="form-label fw-medium small">Password</label>
                            <a href="#" class="text-success small text-decoration-none fw-semibold">Forgot?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-0 ps-0 pe-2"><i class="bi bi-lock text-secondary"></i></span>
                            <input type="password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="mb-4 d-flex align-items-center">
                        <input type="checkbox" class="form-check-input me-2" id="remember">
                        <label class="form-check-label small" for="remember">Remember me for 30 days</label>
                    </div>

                    <button type="submit" class="btn btn-gradient w-100 py-3 mb-4">
                        Log in <i class="bi bi-arrow-right ms-2 transition"></i>
                    </button>

                    <div class="text-center">
                        <p class="small text-secondary mb-0">Don't have an account? <a href="register.html" class="text-success fw-bold text-decoration-none">Sign up</a></p>
                    </div>
                </form>
            </div>
            
            <div class="text-center mt-4">
                <button id="themeToggle" class="btn btn-link text-secondary text-decoration-none small">
                    <i class="bi bi-moon-stars me-2"></i> Switch to Dark Mode
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Theme Toggle Logic
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        
        themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-bs-theme', newTheme);
            themeToggle.innerHTML = newTheme === 'light' ? 
                '<i class="bi bi-moon-stars me-2"></i> Switch to Dark Mode' : 
                '<i class="bi bi-sun me-2"></i> Switch to Light Mode';
        });

        // Form Submission (Staging)
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Authenticating...';
            btn.disabled = true;

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1000);
        });
    </script>
</body>
</html>
