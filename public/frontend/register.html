<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Noubtigo SaaS</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--secondary-bg);
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .auth-card {
            width: 100%;
            max-width: 600px; /* Slightly wider for registration */
            z-index: 10;
        }

        .form-section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--primary-gradient);
            margin-bottom: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
        }

        .form-section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(0, 0, 0, 0.05);
            margin-left: 1rem;
        }

        .form-control {
            border-radius: 12px;
            padding: 0.8rem 1rem;
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card fade-in">
            <div class="glass-card p-5">
                <div class="text-center mb-5">
                    <div class="bg-primary-gradient text-white rounded-3 p-3 d-inline-block mb-3 shadow">
                        <i class="bi bi-buildings-fill fs-3"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Create your Company</h3>
                    <p class="text-secondary small">Start managing your queues and appointments today.</p>
                </div>

                <form id="registerForm">
                    <!-- Company Information -->
                    <div class="form-section-title">Company Details</div>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label small fw-medium">Company Name</label>
                            <input type="text" class="form-control" placeholder="e.g. HealthCenter Pro" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-medium">Company Slug (URL)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">/</span>
                                <input type="text" class="form-control" placeholder="health-center" required>
                            </div>
                        </div>
                    </div>

                    <!-- Owner Information -->
                    <div class="form-section-title">Owner Account</div>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label small fw-medium">Full Name</label>
                            <input type="text" class="form-control" placeholder="John Doe" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-medium">Work Email</label>
                            <input type="email" class="form-control" placeholder="john@company.com" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-medium">Password</label>
                            <input type="password" class="form-control" placeholder="••••••••" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-medium">Confirm Password</label>
                            <input type="password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="mb-4 d-flex align-items-center">
                        <input type="checkbox" class="form-check-input me-2" id="terms" required>
                        <label class="form-check-label small" for="terms">I agree to the <a href="#" class="text-success">Terms & Conditions</a></label>
                    </div>

                    <button type="submit" class="btn btn-gradient w-100 py-3 mb-4 shadow-sm">
                        Create Workspace <i class="bi bi-chevron-right ms-2"></i>
                    </button>

                    <p class="text-center small text-secondary mb-0">
                        Already have an account? <a href="login.html" class="text-success fw-bold text-decoration-none">Log in</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <!-- Theme Toggle (Hidden but functional) -->
    <button id="themeToggle" class="d-none"></button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Form Submission (Staging)
        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Building your workspace...';
            btn.disabled = true;

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        });
    </script>
</body>
</html>
